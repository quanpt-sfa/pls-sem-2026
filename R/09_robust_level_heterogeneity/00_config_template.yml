# ==============================================================================
# 00_config_template.yml
# Sensitivity Analysis for Level-based Heterogeneity (Score-based Clustering)
# ==============================================================================
# Copy this file, edit as needed, then pass the path to the runner:
#   Rscript R/09_robust_level_heterogeneity/01_run_level_heterogeneity.R \
#           config=R/09_robust_level_heterogeneity/00_config_template.yml
# ==============================================================================

enabled: true
seed: 18
bootstrap_samples: 5000
confidence_level: 0.95

# --- Input paths (relative to project root) ---
paths:
  # Preferred: reuse pipeline artifacts
  pls_model_path: "06_structural/pls_model.rds"
  boot_model_path: "06_structural/boot_model.rds"
  active_indicators_path: "06_structural/active_indicators.rds"
  data_path: "02_clean/analysis_ready.rds"
  config_path: "00_meta/analysis_config.yaml"          # base analysis config
  output_dir: "09_robust/level_heterogeneity"

# --- Backend selection ---
# "auto" tries seminr first, then cSEM.  "seminr" or "cSEM" force one.
backend: "auto"

# --- Construct classification ---
# ONLY exogenous constructs are used for clustering.
# Endogenous constructs are listed to enforce circularity checks.
exogenous_constructs:
  - COM
  - PS
  - MO
  - TP
  - IT
  - CEV
  - CG
  - TC
  - ETH

endogenous_constructs:
  - AJ
  - AQ

# --- Clustering ---
clustering:
  method: "kmeans"                  # "kmeans" | "hclust" | "mclust"
  k_candidates: [2, 3, 4, 5]
  scale_scores: true                # z-score standardise before clustering
  center_scores: true               # mean-centre (applied before scaling)
  selection_criteria: "silhouette"   # "silhouette" | "BIC" (mclust only)
  hclust_linkage: "ward.D2"         # only used when method = "hclust"
  kmeans_nstart: 25                 # number of random starts for k-means

# --- MICOM (Henseler et al., 2016) ---
micom:
  permutations: 5000
  alpha: 0.05

# --- MGA (Permutation Multi-Group Analysis) ---
mga:
  permutations: 5000
  alpha: 0.05
  p_adjust_method: "holm"           # "holm" | "BH" | "bonferroni" | "none"
  paths_to_test:
    - "COM -> AJ"
    - "PS -> AJ"
    - "MO -> AJ"
    - "TP -> AJ"
    - "IT -> AJ"
    - "CEV -> AJ"
    - "CG -> AJ"
    - "AJ -> AQ"
    - "TC -> AQ"
    - "ETH -> AQ"

# --- Reporting ---
reporting:
  export_csv: true
  export_md: true
  export_plots: true
  plot_width: 8
  plot_height: 6
  plot_dpi: 300
