# ==============================================================================
# PLS-SEM ANALYSIS CONFIGURATION (Khung CCA — Hair et al., 2022)
# Khóa cấu hình TRƯỚC khi nhìn kết quả mô hình
# Version: 1.1.0
# ==============================================================================

project:
  name: "PLS-SEM Dissertation Analysis — Audit Quality (Khung CCA)"
  version: "1.1.0"
  date_locked: "2026-02-13"
  seed: 42
  bootstrap_samples: 5000
  bootstrap_sensitivity: 10000    # Chạy thêm 10.000 khi kiểm tra độ nhạy
  confidence_level: 0.95
  significance_level: 0.05

# --- Đường dẫn dữ liệu ---
paths:
  data_file: "data.xlsx"
  data_sheet: "Data"
  codebook_sheet: "Code_book"

# --- Biến nhân khẩu / kiểm soát ---
demographics:
  - "Gen"        # Giới tính: Nam=1, Nữ=0
  - "Com"        # Công ty
  - "Cert"       # Chứng chỉ
  - "Exp"        # Kinh nghiệm
  - "Pos"        # Vị trí

meta_columns:
  - "Responder ID"
  - "Time"
  - "Name"

# --- Khai báo cấu trúc (constructs) ---
# measurement_type ĐÃ KHÓA theo phân tích lý thuyết (2026-02-13)
# Reflective (Mode A): PS, TP, IT, CEV, AJ
# Formative  (Mode B): COM, MO, CG, ETH, TC, AQ
constructs:
  - name: "COM"
    full_name: "Auditor Competence"
    measurement_type: "formative"    # Causal — kiến thức + kỹ năng + kinh nghiệm cấu thành năng lực
    indicators: ["COM1", "COM2", "COM3", "COM4", "COM5", "COM6", "COM7", "COM8", "COM9"]
    reverse_coded: []

  - name: "PS"
    full_name: "Professional Skepticism"
    measurement_type: "reflective"
    indicators: ["PS1", "PS2", "PS3", "PS4", "PS5"]
    reverse_coded: []

  - name: "MO"
    full_name: "Motivation"
    measurement_type: "formative"    # Composite — các lý do thúc đẩy độc lập/mâu thuẫn nhau
    indicators: ["MO1", "MO2", "MO3", "MO4", "MO5"]
    reverse_coded: []

  - name: "TP"
    full_name: "Time Budget Pressure"
    measurement_type: "reflective"
    indicators: ["TP1", "TP2", "TP3", "TP4"]
    reverse_coded: []

  - name: "IT"
    full_name: "Use Information Technology"
    measurement_type: "reflective"
    indicators: ["IT1", "IT2", "IT3", "IT4"]
    reverse_coded: []

  - name: "CEV"
    full_name: "Corporate Ethical Values"
    measurement_type: "reflective"
    indicators: ["CEV1", "CEV2", "CEV3", "CEV4", "CEV5"]
    reverse_coded: []

  - name: "CG"
    full_name: "Corporate Governance"
    measurement_type: "formative"    # Composite — chuyên môn HĐQT + tính độc lập + giám sát
    indicators: ["CG1", "CG2", "CG3", "CG4", "CG5", "CG6", "CG7", "CG8", "CG9"]
    reverse_coded: []

  - name: "ETH"
    full_name: "Professional Ethics"
    measurement_type: "formative"    # Composite — phẩm chất + năng lực + trách nhiệm + tuân thủ
    indicators: ["ETH1", "ETH2", "ETH3", "ETH4"]
    reverse_coded: []

  - name: "TC"
    full_name: "Task Complexity"
    measurement_type: "formative"    # Composite — phức tạp từng phần hành riêng lẻ
    indicators: ["TC1", "TC2", "TC3", "TC4", "TC5", "TC6"]
    reverse_coded: []

  - name: "AJ"
    full_name: "Audit Judgment"
    measurement_type: "reflective"
    indicators: ["AJ1", "AJ2", "AJ3"]
    reverse_coded: []

  - name: "AQ"
    full_name: "Audit Quality"
    measurement_type: "formative"    # Causal — quy trình + áp lực quản lý + nỗ lực cá nhân
    indicators: ["AQ1", "AQ2", "AQ3", "AQ4", "AQ5", "AQ6"]
    reverse_coded: []

# --- Cấu trúc bậc cao (Higher-Order Constructs) ---
# Bỏ comment nếu có HOC; ví dụ:
# higher_order:
#   - name: "HOC_AQ"
#     type: "reflective-formative"
#     lower_order: ["AQ_dim1", "AQ_dim2"]
#     estimation: "two_stage"
higher_order: null

# --- Mô hình cấu trúc (Structural Model / Path relationships) ---
# ĐÃ KHÓA theo mô hình giả thuyết (2026-02-13)
# Eq(1): AJ = f(COM, PS, MO, CG, TP, IT, CEV)
# Eq(2): AQ = f(AJ)
# Eq(3): AQ = f(AJ, AJ×TC, AJ×ETH)
structural_paths:
  # --- Eq(1): 7 biến độc lập → AJ (trung gian) ---
  - from: "COM"
    to: "AJ"
  - from: "PS"
    to: "AJ"
  - from: "MO"
    to: "AJ"
  - from: "TP"
    to: "AJ"
  - from: "IT"
    to: "AJ"
  - from: "CEV"
    to: "AJ"
  - from: "CG"
    to: "AJ"

  # --- Eq(2): AJ → AQ ---
  - from: "AJ"
    to: "AQ"

  # --- Eq(3): Direct effects của moderators lên AQ ---
  # Bắt buộc trong PLS-SEM: khi kiểm định tương tác AJ×TC và AJ×ETH,
  # phải có direct effect của TC→AQ và ETH→AQ trong mô hình
  # (Hair et al., 2022, Ch. 7: "Always include the direct effects
  #  of the moderator on the endogenous construct")
  - from: "TC"
    to: "AQ"
  - from: "ETH"
    to: "AQ"

# --- Giả thuyết trung gian (Mediation) ---
# AJ trung gian toàn phần cho quan hệ IVs → AQ
# Kiểm định: X → AJ → AQ (specific indirect effects)
mediation:
  mediator: "AJ"
  indirect_paths:
    - from: "COM"
      through: "AJ"
      to: "AQ"
    - from: "PS"
      through: "AJ"
      to: "AQ"
    - from: "MO"
      through: "AJ"
      to: "AQ"
    - from: "TP"
      through: "AJ"
      to: "AQ"
    - from: "IT"
      through: "AJ"
      to: "AQ"
    - from: "CEV"
      through: "AJ"
      to: "AQ"
    - from: "CG"
      through: "AJ"
      to: "AQ"

# --- Giả thuyết điều tiết (Moderation) ---
# Eq(3): TC và ETH điều tiết cường độ AJ → AQ
moderation:
  interactions:
    - iv: "AJ"
      moderator: "TC"
      dv: "AQ"
      method: "two_stage"
    - iv: "AJ"
      moderator: "ETH"
      dv: "AQ"
      method: "two_stage"

# --- Ngưỡng sàng lọc dữ liệu ---
screening:
  missing_threshold_pct: 10
  speeding_percentile: 5
  speeding_absolute_min_sec: null      # Đặt nếu có mốc từ pilot
  longstring_max: null                  # Để null = tự tính từ dữ liệu
  straightline_block_threshold: 0.90
  flag_threshold_to_remove: 2          # Loại khi ≥ 2 cờ hội tụ

# --- Ngưỡng dữ liệu thiếu ---
missing_data:
  imputation_method: "mean"
  mcar_mar_assumption: "MCAR"

# --- Ngưỡng đo lường phản xạ ---
thresholds_reflective:
  outer_loading_min: 0.708
  outer_loading_drop_range: [0.40, 0.70]
  reliability_min: 0.70
  reliability_max: 0.95
  ave_min: 0.50
  htmt_strict: 0.85
  htmt_lenient: 0.90

# --- Ngưỡng đo lường tạo thành ---
# Hair et al. (2022): VIF < 5 là chấp nhận được, < 3 là lý tưởng
# Quy tắc 2 mức: flag khi > 3 (preferred), loại khi > 5 (max)
thresholds_formative:
  outer_vif_preferred: 3.0          # Lý tưởng — báo cáo nếu vượt
  outer_vif_max: 5.0                # Tham chiếu — cộng tuyến nghiêm trọng
  loading_keep_threshold: 0.50      # Giữ indicator nếu loading ≥ 0.50 dù weight ns

# --- Ngưỡng mô hình cấu trúc ---
thresholds_structural:
  inner_vif_max: 5.0
  f_squared_small: 0.02
  f_squared_medium: 0.15
  f_squared_large: 0.35

# --- CMV ---
cmv:
  full_collinearity_vif_threshold: 3.3   # WARN level (potential CMV)
  full_collinearity_vif_fail: 5.0        # FAIL level (serious CMV)

# --- PLSpredict ---
plspredict:
  k_folds: 10
  repetitions: 10

# --- Thang đo ---
scale:
  min: 1
  max: 5
  type: "likert"

# --- Biến kiểm soát (Control Variables) ---
# Dùng cho Step 4b: dummy/ordinal coding trước khi đưa vào PLS-SEM
# coding_type: "dummy" | "ordinal" | "numeric_passthrough" | "multi_dummy"
control_vars:
  - source_column: "Gen"
    target_column: "Gen_Dummy"
    coding_type: "dummy"
    value_map:
      "Nam": 1
      "Nữ": 0

  - source_column: "Exp"
    target_column: "Exp_Ord"
    coding_type: "ordinal"
    levels:
      - "Từ 3 đến 5 năm"
      - "Trên 5 đến 10 năm"
      - "Trên 10 đến 15 năm"
      - "Trên 15 đến 20 năm"
      - "Trên 20 năm"

  - source_column: "Pos"
    target_column: "Pos_Ord"
    coding_type: "ordinal"
    levels:
      - "Trợ lý kiểm toán"
      - "Kiểm toán viên/Trưởng nhóm"
      - "Trưởng phòng"
      - "Ban giám đốc"

  # Com: 267 công ty — cần group Big4 vs Non-Big4
  # Big4 tại VN: Deloitte, PwC, EY, KPMG
  # Nếu cần dùng, bật multi_dummy hoặc dummy bằng tay
  # (Hiện tại để tham khảo, chưa đưa vào mô hình)
  #- source_column: "Com"
  #  target_column: "Big4"
  #  coding_type: "dummy"
  #  value_map:
  #    # Map thủ công sau khi xem dữ liệu thực tế

  # Cert: tách thành 2 biến nhị phân bằng regex
  # (1) Trình độ: Sau đại học = 1, Đại học = 0
  - source_column: "Cert"
    target_column: "Edu_PostGrad"
    coding_type: "regex_dummy"
    pattern: "Sau đại học"

  # (2) Chứng chỉ CPA/KTV: Có = 1, Không = 0
  - source_column: "Cert"
    target_column: "CPA_Dummy"
    coding_type: "regex_dummy"
    pattern: "Chứng chỉ Kiểm toán viên|CPA"

  # Com: 267 công ty — cần group Big4 vs Non-Big4
  # Big4 tại VN: Deloitte, PwC, EY, KPMG
  # Nếu cần dùng, bật lên và điền value_map
  #- source_column: "Com"
  #  target_column: "Big4"
  #  coding_type: "dummy"
  #  value_map:
  #    # Map thủ công sau khi xem dữ liệu thực tế
